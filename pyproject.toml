[project]
name = "pikvm-agent"
version = "0.1.0"
description = "Agent harness for operating a computer through a PiKVM: screen capture + HID input with guardrails, as a CLI and an MCP server"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pillow>=10",
    "mcp>=1.0",
    "keyring>=24",
    "tomli-w>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# optional: click-target safety check (hid.click(check_label=True)) — OCRs a
# small crop around the click point to catch a destructive-looking GUI button
# (e.g. "Install Now", "Restart & Update") before clicking it. Needs the
# tesseract-ocr system package too (apt/brew install tesseract-ocr); the check
# degrades to a clear error, not a silent no-op, if either is missing.
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
pikvm = "pikvm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pikvm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
